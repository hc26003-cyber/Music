<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Musical - Contacto y Registro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>✉️ Únete a la Comunidad</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="pagina2.html">Galería y Música Libre</a></li>
            <li><a href="pagina3.html" class="active">Contacto</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Formulario de Registro y Sugerencias</h2>
        <form action="#" method="post" class="formulario">
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="genero">Género Favorito:</label>
                <select id="genero" name="genero">
                    <option value="rock">Rock</option>
                    <option value="pop">Pop</option>
                    <option value="jazz">Jazz</option>
                    <option value="electronica">Electrónica</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensaje">Comentarios o recomendaciones de música sin copyright:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>

            <div class="botones">
                <button type="submit">Enviar Registro</button>
                <button type="reset">Limpiar Formulario</button>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Mundo Musical - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
